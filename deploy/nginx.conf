server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # GNU libc resolver do Docker; bien $api_upstream de nginx khong thoat luc khoi
  # dong neu container api chua san (compose van co khi chay rieng le web).
  resolver 127.0.0.11 valid=10s;

  # SPA: mo truc tiep /ket-qua/:id van phai tra index.html cho router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
